#Configuração do sistema de instrumentação

metadata:
  version: "1.0"
  calibration_date: "03-06-2026"
  calibrated_by: "Adriano Viana Werneck"
  description: "Configuração de instrumentação para monitoramento de potência e pressão em bicicleta elétrica"
  notes: |
    Calibração feita na bancada usando fontes e multímetro para obter regressão linear

hardware:
  i2c_bus: "/dev/i2c-2"
  i2c_max_retries: 3        # Maximum I2C read retry attempts
  i2c_retry_delay_ms: 1     # Base retry delay (exponential backoff)
  boards:
    - address: 0x48
      description: "Medições de potência de bateria e hidrogênio"
    - address: 0x49
      description: "Medições de cilindro e barramento auxiliar"

system:
  main_loop_interval_ms: 100    # Taxa de amostragem de 10 Hz
  data_send_interval_ms: 200    # Taxa de transmissão de 5 Hz

channels:
  - board_address: 0x48
    pin: "A0"
    id: "Corrente_Bateria_Principal"
    unit: "A"
    calibration:
      slope: 0.002059726118
      offset: -27.36994605
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x48
    pin: "A1"
    id: "Corrente_Celula_Hidrogenio"
    unit: "A"
    calibration:
      slope: 0.002059726118
      offset: -27.10994605
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x48
    pin: "A2" 
    id: "Tensao_Bateria_Principal"
    unit: "V"
    calibration:
      slope: 0.002311586466
      offset: -0.005998582911
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x48
    pin: "A3"
    id: "Tensao_Celula_Hidrogenio"
    unit: "V"
    calibration:
      slope: 0.002312645744
      offset: -0.00553237918
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x49
    pin: "A0"
    id: "NC" # Medição de corrente não utilizada. Calibrar sensor de corrente caso usar.
    unit: "A"
    calibration:
      slope: 0.00205918
      offset: -27.32578402
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x49
    pin: "A1"
    id: "NC" #Medição de corrente não utilizada. Calibrar sensor de corrente caso usar.
    unit: "A"
    calibration:
      slope: 0.002023360428
      offset: -26.38273375
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

##################################################################################

  - board_address: 0x49
    pin: "A2" 
    id: "Pressao_Cilindro_Hidrogenio"
    unit: "kPa"
    calibration:
      #slope: 0.06934759398    # Calibração para sensor 0-10V --> 0-300 bar
      #offset: -0.17995748733  # Calibração para sensor 0-10V -->  0-300 bar
      #slope: 0.002326          # Calibração para medição direta de tensão
      #offset: -0.00001249      # Calibração para medição direta de tensão
      slope: 0.1162          # Calibração para sensor 0-200kPa --> 0.5V --> 4.5V (alimentação de 5V)
      offset: -25.0823      # Calibração para sensor 0-200kPa --> 0.5V-4.5V (alimentação de 5V)
      #slope: 0.1862          # Calibração para sensor 0-200kPa --> 0.5V-3V   (alimentação de 3V3)
      #offset: -40.2235      # Calibração para sensor 0-200kPa --> 0.5V-3V (alimentação de 3V3)
      
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

  - board_address: 0x49
    pin: "A3"
    id: "Tensao_Barramento_Auxiliar"   #Tensões abaixo de 11V indicam descarregamento da bateria auxiliar
    unit: "V"
    calibration:
      slope: 0.002312645744
      offset: -0.00553237918
    adc:
      gain: "GAIN_4096MV"
      filter_alpha: 0.8

##################################################################################

# Configuração do InfluxDB
influxdb: 
  url: "${INFLUXDB_URL}"
  bucket: "${INFLUXDB_BUCKET}"
  org: "${INFLUXDB_ORG}"
  token: "${INFLUXDB_TOKEN}"

# Configuração de logging
logging:
  csv_enabled: true
  csv_directory: "./logs"

# Monitoramento de bateria com contagem de coulombs
battery:
  coulomb_counting_enabled: true
  capacity_ah: 8
  current_channel_id: "Corrente_Bateria_Principal"

# Rede e comunicação
network:
  socket_server_enabled: true
  socket_port: 2026
  update_interval_ms: 200
